<!-- include "includes/metadata.html" -->
<!-- include "header" -->
 <link href="assets/css/vector.css" rel="stylesheet" type="text/css" media="screen">
<script src="assets/js/vector.js"></script>
<script src="assets/js/lightbox.js"></script>

</head>
<body>

<main class="design">
<!-- lightbox -->
<!-- The Image Table -->
  <section class="row">
    <figure class="column">
    <img src="assets/portfolio/vector/Owl.svg" onclick="modalOpen(); currentSwitch(1)" class="cursor hover-shadow" alt="Owl">
    </figure>
    <figure class="column">
    <img src="" onclick="Openmodal();currentModal(2)" class="cursor hover-shadow" alt="Vector 2">
    </figure>
    <figure class="column">
    <img src="" onclick="Openmodal();currentModal(3)" class="cursor hover-shadow" alt="Vector 3">
    </figure>
    <figure class="column">
    <img src="" onclick="Openmodal();currentModal(4)" class="cursor hover-shadow" alt="Vector 4">
    </figure>
  </section>
<!-- End of the Table-->
<!-- Modal box -->
<section id="lightbox" class="modal">
<span class="close" onclick="modalClose()">×</span>
<div class="modal-graphics">

  <figure class="modalSlide">
    <div class="nr"> 1 / 4</div>
    <img src="assets/portfolio/vector/Owl.svg" width="25%" alt="Owl Slide 1">
  </figure>

  <figure class="modalSlide">
    <div class="nr"> 2 / 4</div>
    <img src="assets/portfolio/vector/Owl.svg" width="25%" alt="Owl Slide 2">
  </figure>

  <figure class="modalSlide">
    <div class="nr"> 3 / 4</div>
    <img src="assets/portfolio/vector/Owl.svg" width="25%" alt="Owl Slide 3">
  </figure>
<!--End of the modal box-->

<!-- Previous & next buttons-->
  <a class="prev" onclick="toggleSwitch(-1)">❮</a>
  <a class="next" onclick="toggleSwitch(1)">❯</a>
  
  <figcaption class="caption">
    <p id="caption"></p>
  </figcaption>

  <figure class="column">
    <img class="ms cursor" src="assets/portfolio/vector/Owl.svg" onclick="currentSwitch(1)" alt="Paper Owl">
    </figure>
    <figure class="column">
      <img class="ms cursor" src="assets/portfolio/vector/Owl.svg" onclick="currentSwitch(2)" alt="Triangle Owl">
    </figure>
     <figure class="column">
      <img class="ms cursor" src="assets/portfolio/vector/Owl.svg" onclick="currentSwitch(3)" alt="Circled Owl">
    </figure>
     <figure class="column">
      <img class="ms cursor" src="assets/portfolio/vector/Owl.svg" onclick="currentSwitch(4)" alt="X Owl">
    </figure>
  </div>
</section>

</main>
<!-- include "footer" -->
</body>
</html>
