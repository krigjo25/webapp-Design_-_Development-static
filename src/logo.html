<body>

<main class="design">

<section id="carousel">
  <figure class="slideshow fade">
    <img src="assets/media/images/footer/Desert.jpg" class="img" alt="Desert">
    <figcaption class="capiton">Los Angeles Desert</figcaption>
  </figure>
  <figure class="slideshow fade">
    <img src="assets/media/images/footer/Hydrangeas.jpg" class="img" alt="Hydrangeas">
    <figcaption class="capiton">Rainforest Hydrangeas</figcaption>
  </figure>
  <figure class="slideshow fade">
    <img src="assets/media/images/footer/Jellyfish.jpg" class="img" alt="Jellyfish">
    <figcaption class="capiton">Norwegian jellyfish</figcaption>
  </figure>
</section>
<br>
<nav id="indicator">
  <div class="indicator"></div>
  <div class="indicator"></div>
  <div class="indicator"></div>
</nav>
</main>
<script>
  var slideIndex = 0;
  showSlides();
  function showSlides() {
    var i;
    var carousel = document.getElementsByClassName("slideshow");
    var indicator = document.getElementsByClassName('indicator');
    for (i = 0; i < carousel.length; i++) {
      carousel[i].style.display = "none";
    }
    slideIndex++;
    if (slideIndex > carousel.length) {slideIndex = 1}
    for (i = 0; i < indicator.length; i++) {
        indicator[i].className = indicator[i].className.replace(" active", "");
    }
    carousel[slideIndex-1].style.display = "block";
    indicator[slideIndex-1].className += " active";
    setTimeout(showSlides, 5000);
  }
</script>
<!-- include "footer" -->
</body>
</html>
